<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Model - Farmer Credit Assessment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/trainModel.css') }}">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f8f3; margin: 0; }
    main { max-width: 1000px; margin: 48px auto; padding: 0 24px; }
    pre { background: #102015; color: #d7f5df; min-height: 320px; padding: 18px; border-radius: 8px; overflow: auto; }
    button { background: #2f6f44; color: #fff; border: 0; border-radius: 6px; padding: 12px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Train Farmer Credit Model</h1>
    <p>Start the training pipeline to rebuild the model from the configured datasets. Training can take several minutes.</p>
    <button id="start-training">Start Training</button>
    <pre id="training-log">Waiting to start...</pre>
  </main>
  <script>
    document.getElementById('start-training').addEventListener('click', () => {
      const log = document.getElementById('training-log');
      log.textContent = '';
      const stream = new EventSource('/train-model/stream');
      stream.onmessage = event => {
        log.textContent += event.data + '\n';
        log.scrollTop = log.scrollHeight;
      };
      stream.addEventListener('complete', event => {
        log.textContent += `\nTraining complete: ${event.data}\n`;
        stream.close();
      });
      stream.onerror = () => {
        log.textContent += '\nTraining stream closed.\n';
        stream.close();
      };
    });
  </script>
</body>
</html>
